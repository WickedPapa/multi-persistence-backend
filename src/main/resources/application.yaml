app:
  datasource: ${APP_DATASOURCE}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/multi_persistence_backend_postgres_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@localhost:27017/multi_persistence_backend_mongo_db?authSource=admin&retryWrites=false
      uuid-representation: standard

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

mongock:
  migration-scan-package: it.montano.multipersistencebackend.config.mongock
  transaction-enabled: false