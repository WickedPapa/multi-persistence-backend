services:

  postgres:
    image: postgres:15
    container_name: postgres-db
    networks:
      default:
        aliases:
          - postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: mongo-db
    networks:
      default:
        aliases:
          - mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo-ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy

  api-server:
    build: .
    container_name: multi-persistence-backend-api-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_DATASOURCE: ${APP_DATASOURCE}
      TZ: Europe/Rome
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: 'curl -f http://localhost:8080/actuator/health -H "Connection: close" || exit 1'
      interval: 5s
      retries: 10

  newman:
    image: postman/newman
    profiles:
      - test-newman
    working_dir: /etc/newman
    volumes:
      - ./postman:/etc/newman
    entrypoint: >
      sh -c '
        echo "Checking whether the API is already running...";
        if ! wget -q -O - http://api-server:8080/actuator/health | grep -q "\"status\":\"UP\""; then
          echo "";
          echo "The API server is not available or not healthy.";
          echo "Please start the application first, then run the Newman tests again.";
          exit 1;
        fi;
        echo "API is healthy. Starting Newman tests...";
        newman run newman_test_collection.json --env-var baseUrl=http://api-server:8080
      '

volumes:
  postgres_data:
  mongo_data:
